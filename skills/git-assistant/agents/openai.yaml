interface:
  display_name: "Git Assistant"
  short_description: "Workspace choice and git closeout for all harnesses"
  default_prompt: "Use $git-assistant for Git tasks. Before implementation, use injected preferences (global ~/.nexus then repo .nexus; repo overrides) or read those paths, then workspace-choice.md. Closeout via closeout.md (commit, unify when worktree, push). Always confirm each git write phase."
